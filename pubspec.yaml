name: logiflow_mobile
description: "LogiFlow Mobile - Enterprise Freight & Logistics Marketplace App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing
  go_router: ^12.1.3

  # Networking & Serialization
  dio: ^5.4.0
  intl: ^0.20.2
  uuid: ^4.3.3
  web_socket_channel: ^2.4.1

  # Free OpenStreetMap & Routing
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Hardware GPS & Location
  geolocator: ^10.1.0

  # Offline Storage & Connectivity
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2

  # Media, Camera & Documents
  image_picker: ^1.0.7
  pdf: ^3.10.7
  printing: ^5.11.1

  # Dependency Injection & Storage
  get_it: ^7.6.4

  # Hardware Sensors & Biometrics
  local_auth: ^2.1.8
  audioplayers: ^5.2.1

  # Icons & UI helpers
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
