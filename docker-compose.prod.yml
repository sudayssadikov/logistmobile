version: '3.9'

services:
  # 1. FastAPI Production Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logiflow_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-logiflow_user}:${DB_PASSWORD:-logiflow_secure_pwd_2026}@postgres:5432/${DB_NAME:-logiflow_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-9f82d8c3b4a5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://logiflow.io,https://app.logiflow.io}
      - ESKIZ_EMAIL=${ESKIZ_EMAIL}
      - ESKIZ_PASSWORD=${ESKIZ_PASSWORD}
      - ESKIZ_FROM=${ESKIZ_FROM:-4546}
      - COTURN_REALM=${COTURN_REALM:-logiflow.io}
      - S3_ENABLED=true
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-logiflow-vault}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-logiflow_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-logiflow_minio_secret_2026}
      - STORAGE_DIR=/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - uploads_vault:/app/uploads
    expose:
      - "8000"

  # 2. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: logiflow_postgres_prod
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-logiflow_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-logiflow_secure_pwd_2026}
      - POSTGRES_DB=${DB_NAME:-logiflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-logiflow_user} -d ${DB_NAME:-logiflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 6

  # 3. Redis 7 Pub/Sub & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: logiflow_redis_prod
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: logiflow_minio_prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-logiflow_minio_admin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-logiflow_minio_secret_2026}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Coturn WebRTC STUN/TURN Server
  coturn:
    image: coturn/coturn:latest
    container_name: logiflow_coturn_prod
    restart: always
    network_mode: host
    command:
      - "-n"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--min-port=49152"
      - "--max-port=65535"
      - "--realm=${COTURN_REALM:-logiflow.io}"
      - "--use-auth-secret"
      - "--static-auth-secret=${COTURN_SECRET:-logiflow_turn_secret_key_prod_2026}"
      - "--fingerprint"
      - "--lt-cred-mech"

  # 5. Flutter Web Production Build
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logiflow_frontend_prod
    restart: always
    expose:
      - "80"

  # 6. Caddy Reverse Proxy & Automatic Let's Encrypt SSL
  caddy:
    image: caddy:2-alpine
    container_name: logiflow_caddy_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_vault:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_vault:
  caddy_data:
  caddy_config:
